# .github/workflows/deploy.yml
name: Deploy Vue.js to GitHub Pages

on:
  push:
    branches: ["main"] # Se activa al hacer push a la rama main
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

# Permisos necesarios para que GitHub Actions pueda desplegar en Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite un solo despliegue concurrente
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" # O la versión que uses
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist" # Vite por defecto genera el build aquí

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
